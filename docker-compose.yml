services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-orion_data_analyzer}
    ports:
      # Host side is 5433, not the Postgres default 5432 — many dev
      # machines already have a native Postgres install bound to 5432,
      # which silently intercepts connections meant for this container
      # (same symptom either way: password auth fails, because you're
      # not even talking to this container). 5433 avoids that clash.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion} -d ${POSTGRES_DB:-orion_data_analyzer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: orion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orion_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orion_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
